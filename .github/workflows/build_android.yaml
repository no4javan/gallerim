name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'Android/**'
      - '.github/workflows/build_android.yaml'

permissions:
  contents: write

jobs:
  build_apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Android/src
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Android SDK Platform 37
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0"
      # A fixed signing key lets a new build install over the old one, keeping models and chats.
      # Without the secrets the build falls back to the runner's throwaway debug key.
      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set, signing with a throwaway debug key"
          fi
      - name: Build
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gallery-apk
          path: Android/src/app/build/outputs/apk/release/*.apk
          retention-days: 30
      # Publishes the APK as a plain file (no zip) at a stable link:
      # https://github.com/<owner>/<repo>/releases/download/latest/gallerim.apk
      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/gallerim.apk"
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest "$RUNNER_TEMP/gallerim.apk" --repo "$GITHUB_REPOSITORY" \
            --title "Latest build" --notes "Built from ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
